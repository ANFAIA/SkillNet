[project]
name = "skillnet-a2a"
version = "0.1.0"
description = "SkillNet A2A agent server"
requires-python = ">=3.12"
dependencies = [
    "a2a-sdk",
    "httpx",
    "litellm<1.92",
    "pydantic>=2",
    "pydantic-settings",
    "uvicorn[standard]",
    "starlette",
]

[dependency-groups]
dev = [
    "pytest",
    "pytest-asyncio",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
asyncio_mode = "auto"
