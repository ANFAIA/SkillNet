[project]
name = "skillnet-api"
version = "0.1.0"
description = "SkillNet FastAPI backend"
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg",
    "greenlet",
    "alembic",
    "pgvector",
    "pydantic>=2",
    "pydantic-settings",
    "fastapi-users[sqlalchemy]",
    "python-multipart",
    "litellm<1.92",
    "langgraph",
    "tiktoken",
    # PDF text extraction. `pypdf` stays for page counting and as the fallback reader;
    # `pdfplumber` is what makes a PDF section-aware, and the existing stack genuinely
    # cannot do it: heading detection needs the font size of each character, and
    # `pypdf.extract_text()` returns a bare string. Without headings a PDF chunk has no
    # section in its citation, loses the chunker's contextual prefix, and — the silent
    # one — can never match `similarity_search_by_headings`, which is how the v2 runtime
    # scopes retrieval to `course_nodes.source_headings`.
    #
    # MIT, like its `pdfminer.six` backend. PyMuPDF is the faster option and was
    # rejected on licence: it is AGPL-3.0 and this repository ships Apache-2.0.
    "pdfplumber",
    "pypdf",
    "python-docx",
    "tenacity",
    "httpx",
    # Direct import in src/core/secrets.py (Fernet), which encrypts the provider API key
    # an organization stores. Already present transitively; declared because we use it.
    "cryptography",
]

[dependency-groups]
dev = [
    "pytest",
    "pytest-asyncio",
    "ruff",
    "aiosqlite",
    "mypy",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = ["integration"]
