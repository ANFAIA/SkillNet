[project]
name = "skillnet-relay"
version = "0.1.0"
description = "SkillNet bug-report relay: judges reports from any instance and files them on GitHub"
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "httpx",
    "litellm<1.92",
    "pydantic>=2",
    "pydantic-settings",
    "uvicorn[standard]",
]

[dependency-groups]
dev = [
    "pytest",
    "pytest-asyncio",
    "ruff<0.16",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
asyncio_mode = "auto"
