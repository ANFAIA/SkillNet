# SkillNet — local Ollama for EMBEDDINGS ONLY, keeping the cloud LLM (gpt-4o-mini).
#
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml -f docker-compose.embed.yml up -d
#
# Unlike docker-compose.ollama.yml, this does NOT override LLM_*: the LLM stays whatever
# the .env says (gpt-4o-mini via the cloud key). Only the embedding provider is pointed at
# the local ollama, so document ingestion can actually store chunks (vector(768)) and every
# node gets real source_headings.
services:
  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    volumes:
      - ollama:/root/.ollama
    # No host port published on purpose: the api reaches ollama over the compose network
    # (hostname `ollama`), and the host already runs an Ollama on 127.0.0.1:11434, so
    # publishing would collide. Add `ports: ["127.0.0.1:11435:11434"]` if host access is
    # ever needed.
    environment:
      OLLAMA_EMBEDDING_MODEL: nomic-embed-text
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        ollama serve &
        server=$$!
        until ollama list >/dev/null 2>&1; do sleep 1; done
        ollama pull "$$OLLAMA_EMBEDDING_MODEL"
        echo "ollama ready: $$OLLAMA_EMBEDDING_MODEL"
        wait $$server
    healthcheck:
      test: ["CMD-SHELL", 'ollama list | grep -q nomic-embed-text']
      interval: 10s
      timeout: 5s
      retries: 60
      start_period: 30s

  api:
    # ONLY embeddings are overridden. LLM_* is intentionally left to the .env (gpt-4o-mini).
    environment:
      EMBEDDING_BASE_URL: http://ollama:11434
      EMBEDDING_API_KEY: ""
      EMBEDDING_MODEL: ollama/nomic-embed-text
      EMBEDDING_DIMENSIONS: 768
    depends_on:
      db:
        condition: service_healthy
      ollama:
        condition: service_healthy

volumes:
  ollama:
    driver: local
