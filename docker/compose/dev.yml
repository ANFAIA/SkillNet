# SkillNet — Development overrides.
# Usage: docker compose -f docker-compose.yml -f docker/compose/dev.yml up --build
# Adds hot reload, debug logging, exposed db/api ports.
#
# `--build` is not decoration: this file overrides `target` to `builder`, and without a
# build the api service silently reuses the `runtime` image, whose PATH has no `uv` —
# the container then dies with `exec: "uv": executable file not found in $PATH`.

services:
  api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
      target: builder
    # `--reload-dir src`: without it uvicorn watches all of /app, so every edit to a
    # test file restarts the API and the container never reaches a healthy state while
    # anyone is working in `tests/`.
    command: ["uv", "run", "uvicorn", "src.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload", "--reload-dir", "src"]
    working_dir: /app
    # The production healthcheck runs `python -c "import httpx"`, which works because the
    # runtime stage puts /app/.venv/bin on PATH. The builder stage does not, so the same
    # command fails on an import and the service is reported unhealthy while answering
    # requests perfectly — and `web`, which waits for `service_healthy`, never starts.
    healthcheck:
      test: ["CMD", "/app/.venv/bin/python", "-c", "import httpx; httpx.get('http://localhost:8000/health').raise_for_status()"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 60s
    environment:
      LOG_LEVEL: debug
      ENVIRONMENT: development
      COOKIE_SECURE: "false"
    volumes:
      - ./apps/skillnet-api:/app
      # An anonymous volume masking the bind mount, and it is load-bearing. The mount
      # above shadows the image's /app/.venv with the host's, which on Windows or macOS
      # is a virtualenv full of foreign binaries. `uv run` then decides the environment
      # is broken, DELETES IT and rebuilds it inside the container — destroying the
      # host venv the test suite runs from. Measured, not theoretical.
      - /app/.venv
    # The `127.0.0.1:` prefix is what separates "exposed to my machine" from "exposed to
    # the network". Docker publishes on 0.0.0.0 by default, and it does so with DNAT
    # rules that **bypass the host firewall** on both Windows and Linux — so "I have a
    # firewall" is not protection here. Port 8000 skips nginx, meaning no security
    # headers and no upload limit; 5432 is Postgres with the password from `.env`. On a
    # shared network that was an open database.
    ports:
      - "127.0.0.1:8000:8000"

  db:
    ports:
      - "127.0.0.1:5432:5432"
