# Security headers, in an include rather than written once at `server` level.
#
# nginx does NOT merge `add_header` down the block hierarchy: a `location` that declares
# any `add_header` of its own DISCARDS every header inherited from its parent. Three
# locations here set their own Cache-Control, so with the directives written once at
# `server` level the SPA — `/`, `/index.html` and `/assets/` — was served with none of
# these three headers, while `/api/` and `/ext/` kept them. Exactly backwards: the HTML
# responses are the ones that need framing and sniffing protection.
#
# So every location that sets a header must include this file too. Verify with:
#   curl -I http://localhost:3000/ | grep -i x-frame-options

add_header X-Frame-Options "DENY" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
