# SkillNet — Production Docker Compose
# One command: docker compose up -d
# Docs: https://github.com/ANFAIA/SkillNet

services:
  # ── Database ────────────────────────────────────────────────
  db:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-skillnet}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-skillnet}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-skillnet} -d ${POSTGRES_DB:-skillnet}"]
      interval: 5s
      timeout: 3s
      retries: 10

  # ── Backend API ─────────────────────────────────────────────
  api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-skillnet}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-skillnet}
      SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY in .env}
      SESSION_LIFETIME_SECONDS: ${SESSION_LIFETIME_SECONDS:-604800}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-}
      LLM_GENERATION_MODEL: ${LLM_GENERATION_MODEL:-}
      LLM_TUTOR_MODEL: ${LLM_TUTOR_MODEL:-}
      LLM_EVAL_MODEL: ${LLM_EVAL_MODEL:-}
      EMBEDDING_BASE_URL: ${EMBEDDING_BASE_URL:-}
      EMBEDDING_API_KEY: ${EMBEDDING_API_KEY:-}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-}
      EMBEDDING_DIMENSIONS: ${EMBEDDING_DIMENSIONS:-384}
      UPLOAD_DIR: /data/uploads
      MAX_UPLOAD_SIZE_MB: ${MAX_UPLOAD_SIZE_MB:-50}
      CORS_ORIGINS: ${CORS_ORIGINS:-["http://localhost:3000"]}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      ENVIRONMENT: ${ENVIRONMENT:-production}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      ORG_NAME: ${ORG_NAME:-SkillNet}
      A2A_INTERNAL_API_KEY: ${A2A_INTERNAL_API_KEY:-}
    volumes:
      - uploads:/data/uploads
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import httpx; httpx.get('http://localhost:8000/health').raise_for_status()"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ── Local Embeddings (optional — enable with: docker compose --profile ollama up)
  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    profiles: [ollama]
    volumes:
      - ollama:/root/.ollama
    command: serve
    healthcheck:
      test: ["CMD-SHELL", "ollama list 2>/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # ── A2A Agent Server (optional) ─────────────────────────────
  a2a:
    build:
      context: .
      dockerfile: docker/a2a.Dockerfile
    restart: unless-stopped
    profiles: [a2a]
    ports:
      - "${A2A_PORT:-5000}:5000"
    environment:
      API_URL: http://api:8000
      SKILLNET_API_KEY: ${A2A_INTERNAL_API_KEY:-}
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_MODEL: ${A2A_LLM_MODEL:-gpt-4o-mini}
      A2A_PORT: "5000"
      A2A_AUTH_KEY: ${A2A_AUTH_KEY:-}
      A2A_AGENT_URL: ${A2A_AGENT_URL:-http://localhost:5000}
    depends_on:
      api:
        condition: service_healthy

  # ── Frontend (nginx + React SPA) ───────────────────────────
  web:
    build:
      context: .
      dockerfile: docker/web.Dockerfile
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:80"
    depends_on:
      api:
        condition: service_healthy

volumes:
  pgdata:
    driver: local
  uploads:
    driver: local
  ollama:
