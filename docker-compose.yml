# SkillNet — Production Docker Compose
# One command: docker compose up -d
# Docs: https://github.com/ANFAIA/SkillNet

services:
  # ── Database ────────────────────────────────────────────────
  db:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-skillnet}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-skillnet}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-skillnet} -d ${POSTGRES_DB:-skillnet}"]
      interval: 5s
      timeout: 3s
      retries: 10

  # ── Backend API ─────────────────────────────────────────────
  api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-skillnet}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-skillnet}
      SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY in .env (32 caracteres o mas)}
      SESSION_LIFETIME_SECONDS: ${SESSION_LIFETIME_SECONDS:-604800}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      # Without this line the `.env` never arrives: no service declares `env_file`, and
      # `.dockerignore` keeps `.env` out of the image, so pydantic's `env_file=".env"`
      # finds nothing inside the container. Only the keys listed here get through — which
      # is why "set DEBUG=true to see Swagger" could never have worked.
      DEBUG: ${DEBUG:-false}
      # Model defaults live HERE, not as an empty string. `${X:-}` leaves the variable
      # *set and empty*, and an empty string beats the default in src/config.py — so with
      # `${LLM_MODEL:-}` putting only LLM_API_KEY in `.env` started nothing: the code's
      # default never applied inside Docker. With these values an OpenAI key is the only
      # thing actually required.
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-gpt-4o-mini}
      LLM_GENERATION_MODEL: ${LLM_GENERATION_MODEL:-}
      LLM_TUTOR_MODEL: ${LLM_TUTOR_MODEL:-}
      LLM_EVAL_MODEL: ${LLM_EVAL_MODEL:-}
      EMBEDDING_BASE_URL: ${EMBEDDING_BASE_URL:-}
      EMBEDDING_API_KEY: ${EMBEDDING_API_KEY:-}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-text-embedding-3-small}
      # 768 rather than 384: migration 0008 pins it on `document_chunks.embedding`. A
      # mismatch makes every chunk insert fail, so the startup check in src/main.py says
      # so in plain words instead of letting it surface when the first document is
      # ingested — where it hides inside the ingestion `except`.
      EMBEDDING_DIMENSIONS: ${EMBEDDING_DIMENSIONS:-768}
      RENDER_BACKEND: ${RENDER_BACKEND:-openui}
      LLM_RUNTIME_FAST_MODEL: ${LLM_RUNTIME_FAST_MODEL:-}
      LLM_RUNTIME_HEAVY_MODEL: ${LLM_RUNTIME_HEAVY_MODEL:-}
      LLM_FIXTURE_DIR: ${LLM_FIXTURE_DIR:-src/llm/fixture_data}
      LLM_FIXTURE_MODE: ${LLM_FIXTURE_MODE:-replay}
      MULTI_AGENT_RENDER: ${MULTI_AGENT_RENDER:-false}
      ADAPTIVE_EPISODES: ${ADAPTIVE_EPISODES:-false}
      ONBOARDING_ENABLED: ${ONBOARDING_ENABLED:-true}
      WORKSPACE_MODE: ${WORKSPACE_MODE:-organization}
      SEMANTIC_ROUTER: ${SEMANTIC_ROUTER:-false}
      UPLOAD_DIR: /data/uploads
      MAX_UPLOAD_SIZE_MB: ${MAX_UPLOAD_SIZE_MB:-50}
      CORS_ORIGINS: ${CORS_ORIGINS:-["http://localhost:3000"]}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      ENVIRONMENT: ${ENVIRONMENT:-production}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      ORG_NAME: ${ORG_NAME:-SkillNet}
      A2A_INTERNAL_API_KEY: ${A2A_INTERNAL_API_KEY:-}
      # TTS + Vision follow the same rule as the models above: `.env` is dockerignored,
      # no service declares `env_file`, so a key only reaches the container if it is
      # listed here. Without these lines `TTS_PROVIDER` defaulted to `disabled` and the
      # audio endpoint 503'd even with a valid ElevenLabs key in `.env`.
      TTS_PROVIDER: ${TTS_PROVIDER:-disabled}
      TTS_API_KEY: ${TTS_API_KEY:-}
      TTS_VOICE: ${TTS_VOICE:-}
      TTS_LANGUAGE: ${TTS_LANGUAGE:-es}
      TTS_AZURE_REGION: ${TTS_AZURE_REGION:-}
      TTS_AZURE_ENDPOINT: ${TTS_AZURE_ENDPOINT:-}
      TTS_TIMEOUT_SECONDS: ${TTS_TIMEOUT_SECONDS:-30}
      VISION_MODEL: ${VISION_MODEL:-}
      # Image generation (infographic poster / cover) for openrouter/* models. Same rule as
      # the keys above: `.env` is dockerignored, so without this line the key never reaches
      # the container and every image call goes out with api_key=None -> 401 Unauthorized.
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      IMAGE_MODEL: ${IMAGE_MODEL:-openrouter/google/gemini-2.5-flash-image}
      IMAGE_FALLBACK_MODEL: ${IMAGE_FALLBACK_MODEL:-gpt-image-1}
      # Generated media (podcast mp3, infographic/cover png) and the TTS cache. Both
      # default to paths RELATIVE to WORKDIR (`/app/data/...`, see src/config.py), which is
      # image filesystem, not a volume: every `docker compose up --build` threw them away
      # and the demo course came back with broken media. Pointed at `/data` here so the
      # named volumes below actually hold them.
      MEDIA_ASSETS_DIR: ${MEDIA_ASSETS_DIR:-/data/media_assets}
      TTS_CACHE_DIR: ${TTS_CACHE_DIR:-/data/tts_cache}
      # Runtime component selection for dynamic courses. Documented in .env.example, so
      # they have to reach the container — there is no env_file, and a setting that is
      # documented but not wired changes nothing and says nothing when you set it.
      RUNTIME_SELECTION_STRATEGY: ${RUNTIME_SELECTION_STRATEGY:-top5/v1}
      RUNTIME_SELECTION_EXECUTION: ${RUNTIME_SELECTION_EXECUTION:-live}
    volumes:
      - uploads:/data/uploads
      - media_assets:/data/media_assets
      - tts_cache:/data/tts_cache
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import httpx; httpx.get('http://localhost:8000/health').raise_for_status()"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ── Keyless demo API (optional — docker compose --profile fixtures up db api-fixtures)
  # Same image as `api`, but every LLM and embedding call is served from the
  # recorded fixtures in src/llm/fixture_data (they ship inside `src`, so the
  # production Dockerfile needs no change). No API key needed.
  # Published on its own port because the bundled nginx SPA proxies to `api`; to
  # run the *whole* stack keyless, set these two values in .env instead.
  api-fixtures:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    restart: unless-stopped
    profiles: [fixtures]
    # `127.0.0.1:` is mandatory here. This service shares `SECRET_KEY` and the database
    # with `api`, so its session cookies are valid against the real API; it has no nginx
    # in front of it. Publishing it on 0.0.0.0 was a second complete API open to
    # the network, carrying the first one's privileges.
    ports:
      - "127.0.0.1:${API_FIXTURES_PORT:-8001}:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-skillnet}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-skillnet}
      SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY in .env}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      LLM_MODEL: fixture/local
      EMBEDDING_MODEL: fixture/local
      # As in `api`: migration 0008 owns the dimension. The fixture embedder generates
      # vectors of exactly this size, so a 384 here breaks the insert against a 768
      # column just as a real provider would.
      EMBEDDING_DIMENSIONS: ${EMBEDDING_DIMENSIONS:-768}
      RENDER_BACKEND: ${RENDER_BACKEND:-openui}
      LLM_FIXTURE_DIR: ${LLM_FIXTURE_DIR:-src/llm/fixture_data}
      LLM_FIXTURE_MODE: replay
      UPLOAD_DIR: /data/uploads
      CORS_ORIGINS: ${CORS_ORIGINS:-["http://localhost:3000"]}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      ENVIRONMENT: ${ENVIRONMENT:-production}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      ORG_NAME: ${ORG_NAME:-SkillNet}
      # Same reason as in `api` above: these default to paths relative to WORKDIR, which
      # is image filesystem, so without them a rebuild silently discards generated media.
      MEDIA_ASSETS_DIR: ${MEDIA_ASSETS_DIR:-/data/media_assets}
      TTS_CACHE_DIR: ${TTS_CACHE_DIR:-/data/tts_cache}
    volumes:
      - uploads:/data/uploads
      - media_assets:/data/media_assets
      - tts_cache:/data/tts_cache
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import httpx; httpx.get('http://localhost:8000/health').raise_for_status()"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # The `ollama` service used to live here and moved to `docker-compose.ollama.yml`,
  # because here it could not work: a `profiles:` entry cannot change the environment of
  # *another* service, so nothing ever told `api` it existed. It also published no port,
  # pulled no model, and its healthcheck (`ollama list`) exits 0 with zero models — it
  # reported itself healthy while being unusable. See that file for the path that works.

  # ── A2A Agent Server (optional) ─────────────────────────────
  a2a:
    build:
      context: .
      dockerfile: docker/a2a.Dockerfile
    restart: unless-stopped
    profiles: [a2a]
    ports:
      - "127.0.0.1:${A2A_PORT:-5000}:5000"
    environment:
      API_URL: http://api:8000
      SKILLNET_API_KEY: ${A2A_INTERNAL_API_KEY:-}
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_MODEL: ${A2A_LLM_MODEL:-gpt-4o-mini}
      A2A_PORT: "5000"
      # Required, and enforced by the server rather than by `${...:?}` here. Compose
      # interpolates the *whole* file regardless of which profiles are active, so a `:?`
      # on an optional service breaks plain `docker compose up` for everyone. The check
      # belongs in `apps/skillnet-a2a/src/main.py`, which now refuses to start without a
      # token instead of silently accepting every caller.
      A2A_AUTH_KEY: ${A2A_AUTH_KEY:-}
      A2A_AGENT_URL: ${A2A_AGENT_URL:-http://localhost:5000}
    depends_on:
      api:
        condition: service_healthy

  # ── MCP Server (optional) ────────────────────────────────────
  # Thin Streamable HTTP wrapper over /ext/v1 for MCP-speaking AI clients. Never
  # touches PostgreSQL; see docs/design/mcp-external-api.md (8.8-8.9) and
  # packages/skillnet-mcp/README.md.
  mcp:
    build:
      context: .
      dockerfile: packages/skillnet-mcp/Dockerfile
    restart: unless-stopped
    profiles: [mcp]
    ports:
      - "127.0.0.1:${SKILLNET_MCP_PORT:-3001}:3001"
    environment:
      SKILLNET_API_URL: http://api:8000
      # Optional: a default API key used when a connecting client sends no
      # Authorization header of its own. Leave unset to require every client to
      # supply its own SkillNet API key.
      SKILLNET_API_KEY: ${SKILLNET_MCP_API_KEY:-}
      MCP_HTTP_PORT: "3001"
    depends_on:
      api:
        condition: service_healthy

  # ── Frontend (nginx + React SPA) ───────────────────────────
  web:
    build:
      context: .
      dockerfile: docker/web.Dockerfile
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:80"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  pgdata:
    driver: local
  uploads:
    driver: local
  # Generated media and synthesized audio are content-addressed and expensive to rebuild
  # (a seed run costs real model calls), so they outlive the container like the database.
  media_assets:
    driver: local
  tts_cache:
    driver: local
