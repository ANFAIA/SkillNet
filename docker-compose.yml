# SkillNet — Production Docker Compose
# One command: docker compose up -d
# Docs: https://github.com/ANFAIA/SkillNet

services:
  # ── Database ────────────────────────────────────────────────
  db:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-skillnet}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-skillnet}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-skillnet} -d ${POSTGRES_DB:-skillnet}"]
      interval: 5s
      timeout: 3s
      retries: 10

  # ── Backend API ─────────────────────────────────────────────
  api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-skillnet}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-skillnet}
      SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY in .env}
      SESSION_LIFETIME_SECONDS: ${SESSION_LIFETIME_SECONDS:-604800}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      # Los modelos llevan default AQUI, no cadena vacia. `${X:-}` deja la variable
      # *puesta y vacia*, y una cadena vacia gana al default de src/config.py, asi que
      # con `${LLM_MODEL:-}` poner solo LLM_API_KEY en el .env no arrancaba nada: el
      # default del codigo no se aplicaba nunca dentro de Docker. Con estos valores,
      # una clave de OpenAI es lo unico obligatorio.
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-gpt-4o-mini}
      LLM_GENERATION_MODEL: ${LLM_GENERATION_MODEL:-}
      LLM_TUTOR_MODEL: ${LLM_TUTOR_MODEL:-}
      LLM_EVAL_MODEL: ${LLM_EVAL_MODEL:-}
      EMBEDDING_BASE_URL: ${EMBEDDING_BASE_URL:-}
      EMBEDDING_API_KEY: ${EMBEDDING_API_KEY:-}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-text-embedding-3-small}
      # 768 y no 384: lo fija la migracion 0008 en la columna `document_chunks.embedding`.
      # Si no coinciden, cada insercion de chunk falla — la comprobacion del arranque
      # (src/main.py) lo dice en claro en vez de dejarlo salir al ingerir el primer
      # documento.
      EMBEDDING_DIMENSIONS: ${EMBEDDING_DIMENSIONS:-768}
      # Dynamic courses (v2). Defaults keep production behaving exactly as today.
      DYNAMIC_COURSES_MODE: ${DYNAMIC_COURSES_MODE:-off}
      RENDER_BACKEND: ${RENDER_BACKEND:-openui}
      LLM_RUNTIME_FAST_MODEL: ${LLM_RUNTIME_FAST_MODEL:-}
      LLM_RUNTIME_HEAVY_MODEL: ${LLM_RUNTIME_HEAVY_MODEL:-}
      LLM_FIXTURE_DIR: ${LLM_FIXTURE_DIR:-src/llm/fixture_data}
      LLM_FIXTURE_MODE: ${LLM_FIXTURE_MODE:-replay}
      UPLOAD_DIR: /data/uploads
      MAX_UPLOAD_SIZE_MB: ${MAX_UPLOAD_SIZE_MB:-50}
      CORS_ORIGINS: ${CORS_ORIGINS:-["http://localhost:3000"]}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      ENVIRONMENT: ${ENVIRONMENT:-production}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      ORG_NAME: ${ORG_NAME:-SkillNet}
      A2A_INTERNAL_API_KEY: ${A2A_INTERNAL_API_KEY:-}
    volumes:
      - uploads:/data/uploads
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import httpx; httpx.get('http://localhost:8000/health').raise_for_status()"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ── Keyless demo API (optional — docker compose --profile fixtures up db api-fixtures)
  # Same image as `api`, but every LLM and embedding call is served from the
  # recorded fixtures in src/llm/fixture_data (they ship inside `src`, so the
  # production Dockerfile needs no change) and v2 is fully on. No API key needed.
  # Published on its own port because the bundled nginx SPA proxies to `api`; to
  # run the *whole* stack keyless, set these three values in .env instead.
  api-fixtures:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    restart: unless-stopped
    profiles: [fixtures]
    ports:
      - "${API_FIXTURES_PORT:-8001}:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-skillnet}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-skillnet}
      SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY in .env}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      LLM_MODEL: fixture/local
      EMBEDDING_MODEL: fixture/local
      # Igual que en `api`: la dimension la manda la migracion 0008. El embebedor de
      # fixtures genera vectores de este tamano, asi que un 384 aqui rompe la insercion
      # contra una columna de 768 igual que lo haria un proveedor real.
      EMBEDDING_DIMENSIONS: ${EMBEDDING_DIMENSIONS:-768}
      DYNAMIC_COURSES_MODE: "on"
      RENDER_BACKEND: ${RENDER_BACKEND:-openui}
      LLM_FIXTURE_DIR: ${LLM_FIXTURE_DIR:-src/llm/fixture_data}
      LLM_FIXTURE_MODE: replay
      UPLOAD_DIR: /data/uploads
      CORS_ORIGINS: ${CORS_ORIGINS:-["http://localhost:3000"]}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      ENVIRONMENT: ${ENVIRONMENT:-production}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      ORG_NAME: ${ORG_NAME:-SkillNet}
    volumes:
      - uploads:/data/uploads
    depends_on:
      db:
        condition: service_healthy

  # ── Local Embeddings (optional — enable with: docker compose --profile ollama up)
  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    profiles: [ollama]
    volumes:
      - ollama:/root/.ollama
    command: serve
    healthcheck:
      test: ["CMD-SHELL", "ollama list 2>/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # ── A2A Agent Server (optional) ─────────────────────────────
  a2a:
    build:
      context: .
      dockerfile: docker/a2a.Dockerfile
    restart: unless-stopped
    profiles: [a2a]
    ports:
      - "${A2A_PORT:-5000}:5000"
    environment:
      API_URL: http://api:8000
      SKILLNET_API_KEY: ${A2A_INTERNAL_API_KEY:-}
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_MODEL: ${A2A_LLM_MODEL:-gpt-4o-mini}
      A2A_PORT: "5000"
      A2A_AUTH_KEY: ${A2A_AUTH_KEY:-}
      A2A_AGENT_URL: ${A2A_AGENT_URL:-http://localhost:5000}
    depends_on:
      api:
        condition: service_healthy

  # ── Frontend (nginx + React SPA) ───────────────────────────
  web:
    build:
      context: .
      dockerfile: docker/web.Dockerfile
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:80"
    depends_on:
      api:
        condition: service_healthy

volumes:
  pgdata:
    driver: local
  uploads:
    driver: local
  ollama:
